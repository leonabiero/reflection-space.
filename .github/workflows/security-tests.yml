name: Security and Privacy Tests

on:
  push:
    branches: [main, phase1-security-privacy]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run security/privacy tests
        run: python -m unittest discover -s tests -p 'test_security_*.py' -v
