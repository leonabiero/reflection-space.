[client]
showSidebarNavigation = false

# Security hardening: never show raw Python tracebacks / exception
# details to end users if an error somehow escapes the app's own
# error_boundary() handling (services/error_log.py). Users only ever
# see the friendly "Something went wrong, here's a reference number"
# message; full technical detail still goes to the private Error Log
# on the System Administration page.
showErrorDetails = false

[theme]
# ---------------------------------------------------------------
# "Cuaderno de consulta" -- deep indigo ink (dark theme)
# Ported from the Lovable design export (src/styles.css design
# tokens). Original tokens were defined in OKLCH; converted to hex
# below since Streamlit's theme engine takes hex colors.
# ---------------------------------------------------------------
base = "dark"

primaryColor = "#d58966"              # clay -- Practitioner-mode accent, used app-wide as the interactive color
backgroundColor = "#0f1223"           # deep indigo background
secondaryBackgroundColor = "#1a1e2f"  # surface -- widget backgrounds, cards
textColor = "#eae8e2"                 # warm off-white foreground
linkColor = "#d58966"

borderColor = "#363846"               # composited from the design's translucent border-strong token
codeTextColor = "#a1a4b2"             # muted-foreground
codeBackgroundColor = "#222634"       # muted

baseRadius = "14px"                   # matches the design's --radius: 0.875rem
buttonRadius = "14px"

showWidgetBorder = true
showSidebarBorder = true

# Three-tier type system from the design: serif for reflective
# questions, sans for interface/body text, mono for labels/tags.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "'Cormorant Garamond':https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap, serif"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#1a1e2f"           # surface -- one step lighter than the main background
secondaryBackgroundColor = "#242838"  # surface-raised
textColor = "#eae8e2"
borderColor = "#363846"
primaryColor = "#d58966"