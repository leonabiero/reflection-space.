<!DOCTYPE html>
<!--
  Screenshot Reporter -- a minimal, hand-written Streamlit component.

  WHY THIS EXISTS
  ------------------
  Leon (the app's non-developer owner) wants a "Report a problem" button
  that captures a screenshot of the app automatically. Streamlit has no
  built-in screenshot API, so this component does it in the browser
  (via the well-known html2canvas library) and sends the image back to
  the Python side.

  HOW IT WORKS / HOW FRAGILE THIS IS -- please read before touching
  --------------------------------------------------------------------
  A normal Streamlit custom component is a small React app built with
  streamlit-component-lib and a build step (npm/webpack). To avoid
  requiring Leon to run any build tooling, this file instead talks to
  Streamlit's frontend directly using the same underlying browser
  messages (window.postMessage) that streamlit-component-lib sends
  under the hood. This is the SAME technique used by a few known
  no-build-step community components (e.g. "streamlit-javascript").

  This is NOT a documented, version-guaranteed public API -- it is the
  actual wire protocol Streamlit's frontend currently listens for. If a
  future Streamlit release changes it, this component could silently
  stop returning a screenshot. That is why:
    - Every failure path below falls back to sending `value: null`
      rather than hanging forever.
    - services/report_widget.py NEVER blocks sending a report on this
      succeeding -- a report with no screenshot still gets logged and
      emailed. The screenshot is a nice-to-have, not a dependency.

  If reports stop including screenshots after a Streamlit upgrade, that
  is the first thing to suspect -- ask Claude to re-check the current
  Streamlit component message protocol and update this file only.

  HISTORY (condensed) -- why the old "one giant html2canvas render"
  approach was abandoned
  --------------------------------------------------------------------
  Earlier versions of this file tried to capture the ENTIRE scrollable
  page in a single html2canvas call, by temporarily forcing Streamlit's
  scroll container (`[data-testid="stAppViewContainer"]`) to
  `overflow: visible; height: auto; max-height: none` so the browser
  would lay out and paint content that is normally clipped off-screen,
  then asking html2canvas to render that whole unclipped subtree at
  once. Along the way this surfaced (and eventually fixed) some real
  bugs worth remembering:
    - A page containing a large plain HTML table (st.table -- NOT
      st.dataframe, which is a lightweight canvas widget regardless of
      row count) could make html2canvas walk thousands of DOM nodes on
      the browser's single main thread, long enough to trigger
      Chrome's "Page Unresponsive" dialog.
    - This component itself lives inside an <iframe> (every Streamlit
      custom component does). Pointing html2canvas at the whole page
      made it try to capture itself mid-capture, which can hang.
    - Forcing `overflow: visible` did make full content PAINT, but the
      whole "unclip everything and render it all in one pass" strategy
      is fundamentally fragile: it depends on every descendant
      re-laying-out correctly outside its normal clipped/scrolled
      context, which virtualized widgets and some canvas-backed
      widgets don't do reliably. That is a structural ceiling, not
      something fixable with more CSS overrides -- so as of this
      rewrite we've stopped doing it.

  CURRENT APPROACH (this rewrite) -- scroll, capture, stitch
  --------------------------------------------------------------------
  Instead of forcing the whole page to render unclipped in one pass, we
  now do what a real screenshot browser extension does: scroll the
  actual Streamlit scroll container to each position a person would
  really scroll to, let it render normally (nothing is unclipped or
  forced), capture ONLY the currently-visible viewport with
  html2canvas, then move on to the next viewport. Once we've covered
  the full scrollHeight, all the viewport captures are drawn onto one
  tall off-screen <canvas> at their real scroll offsets and exported
  exactly as before: `canvas.toDataURL("image/jpeg", 0.6)`. The
  reporting API (what services/report_widget.py receives) is
  unchanged -- it is still just that same base64 JPEG data URL, or
  null on failure.

  Why this is more reliable: every individual capture is a small,
  cheap, "what's on screen right now" render -- exactly the kind of
  capture that already worked reliably here before any full-page
  attempts. Nothing has to be unclipped, re-laid-out, or rendered
  outside its normal scrolled context, because at each step the
  content genuinely IS on screen, the same way it would be for a human
  scrolling through the page.

  Known remaining limitation: a widget that virtualizes its OWN
  internal scrolling (renders only its currently-visible rows inside
  its own internal scroll region, independent of the page scroll) will
  only show whatever rows happen to be visible inside it when the page
  scroll passes that widget -- scrolling the page does not scroll
  inside such a widget. This is a structural limit of any DOM-based
  capture technique, including real browser extensions, not something
  particular to this implementation.

  Safety measures carried over unchanged from before:
    - ALL <iframe> elements are skipped (ignoreElements) -- this is
      what stops the component from trying to capture itself.
    - Plain <table> elements / role="table" / elements with more than
      40 children are skipped -- these are the expensive st.table-style
      structures that could freeze the tab.
    - A cheap total-element-count check happens once up front as a
      backstop; pages above MAX_SAFE_ELEMENT_COUNT are skipped entirely
      rather than risking a freeze.
    - A global TIMEOUT_MS safety net still guarantees we eventually
      call sendValue(null) and restore everything if anything above
      takes too long or throws.

  New in this rewrite, to satisfy "capture exactly what the user sees,
  without letting the page change mid-capture":
    - The user's real scroll position is saved before we start and
      restored (on every exit path: success, failure, or timeout)
      immediately before we hand control back.
    - A full-screen overlay is shown on the actual visible page (not
      just inside this hidden iframe) telling the person a screenshot
      is being captured and not to interact. Because it sits on top of
      everything with pointer-events enabled on itself, it also
      physically blocks clicks from reaching the app underneath while
      capture is in progress.
    - Consecutive viewport captures deliberately OVERLAP by a small
      percentage of the viewport height (rather than being placed
      edge-to-edge). This is what the prompt calls for explicitly:
      sticky headers, browser zoom, and fractional-pixel scroll
      rounding can otherwise leave a thin missing (or misaligned)
      strip between two captures. Because each capture is stitched
      onto the output canvas at the exact scroll offset it was taken
      at (not at an assumed fixed increment), the overlapping region
      is simply painted over by the next capture down -- no gap, no
      double-counted height.

  Separately (see services/report_widget.py for the actual fix): a
  capture that legitimately finishes with no screenshot (page skipped
  as too large, or timed out) was being mistaken for "still in
  progress" forever, which could let a report get sent without a
  screenshot the person thought they'd already captured. That's a
  Python-side state-tracking fix, not something in this file, and it
  remains unaffected by this rewrite.
-->
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body style="margin:0;">
<div id="status" style="font-family: sans-serif; font-size: 13px; color: #666; padding: 4px;">
  Capturing screenshot...
</div>
<script>
(function () {
  var SENT = false;

  // If the page has more elements than this, we skip the screenshot
  // rather than risk freezing the tab. This is a rare-case backstop --
  // the ignoreElements rule below already removes the actual expensive
  // content (plain HTML tables, iframes) before we get here, so this
  // threshold is set high on purpose. It exists to catch genuinely
  // unusual pages, not to limit normal use.
  var MAX_SAFE_ELEMENT_COUNT = 6000;

  // Give up on the ENTIRE multi-step capture after this long. Raised
  // from earlier single-shot values because scroll-and-stitch takes
  // several capture passes; this is still a backstop, not the expected
  // path -- normal pages finish well within this.
  var TIMEOUT_MS = 20000;

  // Hard cap on how many viewport "steps" we'll take down the page,
  // regardless of measured height. This protects against a page whose
  // scrollHeight keeps growing while we capture it (e.g. infinite
  // scroll) turning into an unbounded loop.
  var MAX_STEPS = 25;

  // Marks the overlay element so ignoreElements can exclude it from
  // any capture in the rare fallback case where the capture target IS
  // the overlay's parent (see below).
  var OVERLAY_ID = "__reflection_space_capture_overlay__";

  // Collected as we make temporary changes (scroll position, overlay,
  // interaction blocking) so we can always put things back exactly as
  // they were -- on every exit path (success, failure, or timeout).
  var restoreFns = [];
  function restoreAll() {
    while (restoreFns.length) {
      try { restoreFns.pop()(); } catch (e) { /* best effort */ }
    }
  }

  function postToStreamlit(type, extra) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, extra || {});
    window.parent.postMessage(msg, "*");
  }

  function sendValue(value) {
    if (SENT) return; // never send twice
    SENT = true;
    restoreAll();
    postToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el) el.innerText = text;
  }

  // Tell Streamlit this component iframe is alive, and give it a
  // small fixed height (this component has no meaningful visible UI
  // -- the real UI is the Python-side status/preview in the sidebar,
  // plus the full-screen capture overlay this file injects into the
  // parent page while a capture is running).
  postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  postToStreamlit("streamlit:setFrameHeight", { height: 24 });

  // Safety net: if the whole capture hasn't finished within
  // TIMEOUT_MS for any reason (slow page, blocked script, unexpected
  // error), give up and report "no screenshot" rather than leaving the
  // report form stuck. sendValue() -> restoreAll() guarantees the
  // overlay/scroll/interaction state gets put back even here.
  window.setTimeout(function () {
    if (!SENT) {
      setStatus("Screenshot capture timed out -- continuing without it.");
      sendValue(null);
    }
  }, TIMEOUT_MS);

  // rAF x2: gives the browser two animation frames to finish any
  // reflow/paint work (e.g. from the scroll we just performed) before
  // we consider the page "settled" enough to capture.
  function twoAnimationFrames() {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(resolve);
      });
    });
  }

  function delay(ms) {
    return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
  }

  // Forces any lazy-loaded images anywhere in `root` to load right now
  // (instead of waiting for them to individually scroll into view,
  // which we want to short-circuit since we're about to scroll through
  // everything ourselves anyway), then resolves once all of them have
  // finished or a short backstop timer elapses. Run once, up front, so
  // no viewport along the way shows a blank image box.
  function forceEagerImages(root) {
    return new Promise(function (resolve) {
      var imgs = root.querySelectorAll('img[loading="lazy"]');
      var pending = 0;
      var settled = false;

      function proceed() {
        if (settled) return;
        settled = true;
        resolve();
      }

      imgs.forEach(function (img) {
        img.loading = "eager";
        if (!img.complete) {
          pending++;
          var done = function () {
            pending -= 1;
            if (pending <= 0) proceed();
          };
          img.addEventListener("load", done, { once: true });
          img.addEventListener("error", done, { once: true });
        }
      });

      // Backstop: never wait more than 1.5s on images, even if some
      // never finish loading.
      window.setTimeout(proceed, 1500);

      if (pending === 0) proceed();
    });
  }

  // Shared ignoreElements rule for every html2canvas call below.
  function shouldIgnoreElement(el) {
    try {
      // Skip ALL iframes -- this is what stops the component from
      // trying to capture itself (it lives inside one).
      if (el.tagName === "IFRAME") return true;
      if (el.tagName === "TABLE") return true;
      if (el.getAttribute && el.getAttribute("role") === "table") return true;
      if (el.id === OVERLAY_ID) return true;
      if (el.children && el.children.length > 40) return true;
    } catch (e) {
      return false;
    }
    return false;
  }

  // Builds the "please don't interact" overlay directly on the real,
  // visible page (window.parent's document) -- not inside this hidden
  // iframe, since that's not where the person is looking. Being
  // position:fixed, full-screen, and on top of everything with
  // pointer-events enabled on itself, it both communicates what's
  // happening and physically absorbs clicks so the page can't change
  // mid-capture. Returns a remove() function.
  function showCaptureOverlay(parentDoc) {
    var overlay = parentDoc.createElement("div");
    overlay.id = OVERLAY_ID;
    overlay.setAttribute("style", [
      "position:fixed", "inset:0", "z-index:2147483647",
      "background:rgba(255,255,255,0.55)",
      "display:flex", "align-items:center", "justify-content:center",
      "text-align:center", "cursor:wait",
      "font-family:sans-serif", "font-size:15px", "color:#222",
      "pointer-events:auto",
    ].join(";"));
    overlay.innerHTML =
      '<div style="background:#fff;border:1px solid #ddd;border-radius:8px;' +
      'padding:20px 28px;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-width:320px;">' +
      "Capturing screenshot...<br>Please don't interact for a moment." +
      "</div>";
    // Block keyboard-driven interaction too (e.g. Tab/Enter reaching
    // an already-focused element underneath).
    var blockEvent = function (e) { e.stopPropagation(); e.preventDefault(); };
    ["click", "mousedown", "mouseup", "keydown", "keyup", "wheel", "touchstart", "touchmove"]
      .forEach(function (evt) {
        overlay.addEventListener(evt, blockEvent, { capture: true });
      });
    parentDoc.body.appendChild(overlay);
    return function remove() {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    };
  }

  function getParentDocument(w) {
    try { return w && w.document ? w.document : null; } catch (e) { return null; }
  }

  async function run() {
    var parentWin = window.parent || window;
    var parentDoc = getParentDocument(parentWin) || document;

    // Streamlit doesn't scroll the whole browser page -- the outer
    // <body> stays fixed to the window height, and an inner panel
    // (identified by this data-testid) scrolls independently. Capture
    // that inner panel specifically; fall back to scrolling the actual
    // browser window/body only if Streamlit's internal structure ever
    // changes and this selector stops matching.
    var target = parentDoc.querySelector('[data-testid="stAppViewContainer"]');
    var usingWindowScroll = false;
    if (!target) {
      target = parentDoc.body || document.body;
      usingWindowScroll = true;
    }

    // Cheap, near-instant safety check -- does NOT redraw anything,
    // just counts existing elements.
    var elementCount = target.querySelectorAll("*").length;
    if (elementCount > MAX_SAFE_ELEMENT_COUNT) {
      setStatus("This page is too large to screenshot automatically -- continuing without it.");
      sendValue(null);
      return;
    }

    // 1. Save the user's current scroll position, and register its
    // restoration on every exit path.
    var originalScroll = usingWindowScroll
      ? (parentWin.scrollY || parentDoc.documentElement.scrollTop || 0)
      : target.scrollTop;
    restoreFns.push(function () {
      if (usingWindowScroll) parentWin.scrollTo(0, originalScroll);
      else target.scrollTop = originalScroll;
    });

    // 2 & 3. Show the "capturing" overlay and block interaction; also
    // guarantee its removal on every exit path.
    var removeOverlay = showCaptureOverlay(parentDoc);
    restoreFns.push(removeOverlay);

    setStatus("Capturing screenshot...");

    // One-time, whole-page pass so no viewport along the way shows a
    // blank lazy-loaded image.
    await forceEagerImages(target);

    function getScroll() {
      return usingWindowScroll
        ? (parentWin.scrollY || parentDoc.documentElement.scrollTop || 0)
        : target.scrollTop;
    }
    function setScroll(y) {
      if (usingWindowScroll) parentWin.scrollTo(0, y);
      else target.scrollTop = y;
    }

    var viewportWidth = usingWindowScroll ? parentWin.innerWidth : target.clientWidth;
    var viewportHeight = usingWindowScroll ? parentWin.innerHeight : target.clientHeight;
    var contentHeight = Math.max(
      usingWindowScroll ? parentDoc.documentElement.scrollHeight : target.scrollHeight,
      viewportHeight
    );

    if (!viewportWidth || !viewportHeight) {
      setStatus("Screenshot capture unavailable -- continuing without it.");
      sendValue(null);
      return;
    }

    // Do NOT assume viewport height divides evenly into page height,
    // and deliberately OVERLAP consecutive captures so that sticky
    // headers, browser zoom, and fractional-pixel scroll rounding
    // can't leave a thin missing strip between two captures. Each
    // capture is later stitched onto the output at the exact scroll
    // offset it was actually taken at, so the overlap is simply
    // painted over -- no gap, no double-counted height.
    var overlapPx = Math.max(24, Math.round(viewportHeight * 0.08));
    var step = Math.max(1, viewportHeight - overlapPx);
    var maxScroll = Math.max(0, contentHeight - viewportHeight);

    // 4 & 5. Identify the scrolling container (done above) and scroll
    // to the top before the first capture.
    setScroll(0);
    await twoAnimationFrames();
    await delay(120);

    var captures = [];
    var y = 0;
    var steps = 0;

    while (true) {
      setScroll(y);
      var actualY = getScroll(); // account for any browser clamping/rounding

      // 8. Wait for Streamlit to finish rendering newly visible
      // content: two animation frames plus a short bounded delay,
      // rather than an arbitrary long sleep.
      await twoAnimationFrames();
      await delay(120);

      // 6/9. Capture ONLY the currently visible viewport.
      var canvas = await html2canvas(target, {
        logging: false,
        useCORS: true,
        scale: 1,
        x: 0,
        y: usingWindowScroll ? actualY : 0,
        scrollX: 0,
        scrollY: 0,
        width: viewportWidth,
        height: viewportHeight,
        windowWidth: usingWindowScroll ? Math.max(parentDoc.documentElement.scrollWidth, viewportWidth) : viewportWidth,
        windowHeight: usingWindowScroll ? Math.max(contentHeight, viewportHeight) : viewportHeight,
        ignoreElements: shouldIgnoreElement,
      });

      captures.push({ y: actualY, canvas: canvas });
      steps++;

      if (actualY >= maxScroll || steps >= MAX_STEPS) break;
      y = Math.min(actualY + step, maxScroll);
    }

    // Re-measure content height after the scroll pass in case
    // anything settled to a slightly different final size.
    var finalContentHeight = Math.max(
      contentHeight,
      usingWindowScroll ? parentDoc.documentElement.scrollHeight : target.scrollHeight
    );
    // Canvas height ceiling as a defensive cap for pathologically long
    // pages (browsers impose their own limits well beyond this).
    var stitchedHeight = Math.min(Math.round(finalContentHeight), 20000);

    // 11. Stitch all captured viewports into one tall off-screen
    // canvas, each drawn at the real scroll offset it was captured at
    // (this is what correctly absorbs the deliberate overlap between
    // consecutive captures -- later, lower captures simply repaint the
    // small overlapping strip from the capture above them).
    var stitched = document.createElement("canvas");
    stitched.width = viewportWidth;
    stitched.height = stitchedHeight;
    var ctx = stitched.getContext("2d");
    captures.forEach(function (c) {
      ctx.drawImage(c.canvas, 0, c.y);
    });

    // 12. Export using the exact same format the Python side already
    // expects -- no change to the reporting API.
    var dataUrl = stitched.toDataURL("image/jpeg", 0.6);
    setStatus("Screenshot captured.");
    sendValue(dataUrl);
  }

  run().catch(function () {
    setStatus("Could not capture screenshot -- continuing without it.");
    sendValue(null);
  });
})();
</script>
</body>
</html>
