<!DOCTYPE html>
<!--
  Screenshot Reporter -- a minimal, hand-written Streamlit component.

  WHY THIS EXISTS
  ------------------
  Leon (the app's non-developer owner) wants a "Report a problem" button
  that captures a screenshot of the app automatically. Streamlit has no
  built-in screenshot API, so this component does it in the browser
  (via the well-known html2canvas library) and sends the image back to
  the Python side.

  HOW IT WORKS / HOW FRAGILE THIS IS -- please read before touching
  --------------------------------------------------------------------
  A normal Streamlit custom component is a small React app built with
  streamlit-component-lib and a build step (npm/webpack). To avoid
  requiring Leon to run any build tooling, this file instead talks to
  Streamlit's frontend directly using the same underlying browser
  messages (window.postMessage) that streamlit-component-lib sends
  under the hood. This is the SAME technique used by a few known
  no-build-step community components (e.g. "streamlit-javascript").

  This is NOT a documented, version-guaranteed public API -- it is the
  actual wire protocol Streamlit's frontend currently listens for. If a
  future Streamlit release changes it, this component could silently
  stop returning a screenshot. That is why:
    - Every failure path below falls back to sending `value: null`
      rather than hanging forever.
    - services/report_widget.py NEVER blocks sending a report on this
      succeeding -- a report with no screenshot still gets logged and
      emailed. The screenshot is a nice-to-have, not a dependency.

  If reports stop including screenshots after a Streamlit upgrade, that
  is the first thing to suspect -- ask Claude to re-check the current
  Streamlit component message protocol and update this file only.

  2026-07-30 UPDATE -- fixed a real browser-freeze bug
  --------------------------------------------------------------------
  On pages with a large plain HTML table (built with Streamlit's
  st.table, which creates one <tr> element per row), html2canvas had
  to walk thousands of DOM elements to build the screenshot. That work
  runs on the browser's single main thread, so on a big enough page it
  could tie the tab up for so long that Chrome showed its "Page
  Unresponsive" dialog and the whole app stopped responding to clicks
  -- the 8-second safety timer below never got a chance to fire,
  because the browser was too busy to even check the clock.

  Note: Streamlit's st.dataframe (used for the System Administration
  user list) is NOT the same as st.table -- it renders as a single
  lightweight canvas element regardless of row count, so it was never
  actually the expensive part here.

  Fix, two layers:
    1. `ignoreElements` below skips plain <table> elements and any
       element with more than 40 children when drawing -- this
       removes the actual expensive content (st.table output)
       specifically, with no visible effect on st.dataframe grids.
    2. As a backstop only (not the primary fix), we also count total
       page elements before attempting anything and skip entirely if
       it's above MAX_SAFE_ELEMENT_COUNT. Because layer 1 already
       removes the known expensive content, this threshold is set
       high -- it exists only to catch genuinely unusual pages, not
       to limit normal use of the app.
-->
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body style="margin:0;">
<div id="status" style="font-family: sans-serif; font-size: 13px; color: #666; padding: 4px;">
  Capturing screenshot...
</div>
<script>
(function () {
  var SENT = false;

  // If the page has more elements than this, we skip the screenshot
  // rather than risk freezing the tab. This is a rare-case backstop,
  // not the main defense -- the ignoreElements rule below already
  // removes the actual expensive content (plain HTML tables) before
  // we get here, so this threshold is set high on purpose. It exists
  // to catch genuinely unusual pages, not to limit normal use.
  var MAX_SAFE_ELEMENT_COUNT = 6000;

  // Give up and continue without a screenshot after this long.
  var TIMEOUT_MS = 4000;

  function postToStreamlit(type, extra) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, extra || {});
    window.parent.postMessage(msg, "*");
  }

  function sendValue(value) {
    if (SENT) return; // never send twice
    SENT = true;
    postToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el) el.innerText = text;
  }

  // Tell Streamlit this component iframe is alive, and give it a
  // small fixed height (this component has no meaningful visible UI
  // -- the real UI is the Python-side status/preview in the sidebar).
  postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  postToStreamlit("streamlit:setFrameHeight", { height: 24 });

  // Safety net: if capture hasn't finished within TIMEOUT_MS for any
  // reason (slow page, blocked script, unexpected error), give up and
  // report "no screenshot" rather than leaving the report form stuck.
  // (This still exists as a backstop, but the real fix is the
  // element-count check below, which prevents the freeze in the
  // first place instead of trying to recover from it.)
  window.setTimeout(function () {
    if (!SENT) {
      setStatus("Screenshot capture timed out -- continuing without it.");
      sendValue(null);
    }
  }, TIMEOUT_MS);

  try {
    var parentDoc = (window.parent && window.parent.document) ? window.parent.document : document;
    var target = parentDoc.body || document.body;

    // Cheap, near-instant safety check -- does NOT redraw anything,
    // just counts existing elements. This is what actually prevents
    // the freeze on heavy pages like System Administration.
    var elementCount = target.querySelectorAll("*").length;
    if (elementCount > MAX_SAFE_ELEMENT_COUNT) {
      setStatus("This page is too large to screenshot automatically -- continuing without it.");
      sendValue(null);
      return;
    }

    var win = window.parent || window;
    var scrollX = win.scrollX || 0;
    var scrollY = win.scrollY || 0;
    var viewportWidth = win.innerWidth || document.documentElement.clientWidth;
    var viewportHeight = win.innerHeight || document.documentElement.clientHeight;

    html2canvas(target, {
      logging: false,
      useCORS: true,
      scale: 1,
      // Only render what's currently visible on screen, not the full
      // scrollable page -- much cheaper, and it's what the user
      // actually saw when they noticed the problem.
      x: scrollX,
      y: scrollY,
      width: viewportWidth,
      height: viewportHeight,
      windowWidth: viewportWidth,
      windowHeight: viewportHeight,
      // Skip large repeating structures (tables, data grids) -- these
      // are the most expensive part to redraw and rarely the reason
      // someone is reporting a problem. A short note is drawn in
      // their place instead of leaving a blank gap.
      ignoreElements: function (el) {
        try {
          if (el.tagName === "TABLE") return true;
          if (el.getAttribute && el.getAttribute("role") === "table") return true;
          if (el.querySelectorAll && el.children && el.children.length > 40) return true;
        } catch (e) {
          return false;
        }
        return false;
      },
    }).then(function (canvas) {
      try {
        // JPEG at moderate quality keeps the payload well under any
        // reasonable database column / email attachment size limit.
        var dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        setStatus("Screenshot captured.");
        sendValue(dataUrl);
      } catch (e) {
        setStatus("Could not encode screenshot -- continuing without it.");
        sendValue(null);
      }
    }).catch(function () {
      setStatus("Could not capture screenshot -- continuing without it.");
      sendValue(null);
    });
  } catch (e) {
    setStatus("Screenshot capture unavailable -- continuing without it.");
    sendValue(null);
  }
})();
</script>
</body>
</html>
