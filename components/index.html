<!DOCTYPE html>
<!--
  Screenshot Reporter -- a minimal, hand-written Streamlit component.

  WHY THIS EXISTS
  ------------------
  Leon (the app's non-developer owner) wants a "Report a problem" button
  that captures a screenshot of the app automatically. Streamlit has no
  built-in screenshot API, so this component does it in the browser
  (via the well-known html2canvas library) and sends the image back to
  the Python side.

  HOW IT WORKS / HOW FRAGILE THIS IS -- please read before touching
  --------------------------------------------------------------------
  A normal Streamlit custom component is a small React app built with
  streamlit-component-lib and a build step (npm/webpack). To avoid
  requiring Leon to run any build tooling, this file instead talks to
  Streamlit's frontend directly using the same underlying browser
  messages (window.postMessage) that streamlit-component-lib sends
  under the hood. This is the SAME technique used by a few known
  no-build-step community components (e.g. "streamlit-javascript").

  This is NOT a documented, version-guaranteed public API -- it is the
  actual wire protocol Streamlit's frontend currently listens for. If a
  future Streamlit release changes it, this component could silently
  stop returning a screenshot. That is why:
    - Every failure path below falls back to sending `value: null`
      rather than hanging forever.
    - services/report_widget.py NEVER blocks sending a report on this
      succeeding -- a report with no screenshot still gets logged and
      emailed. The screenshot is a nice-to-have, not a dependency.

  If reports stop including screenshots after a Streamlit upgrade, that
  is the first thing to suspect -- ask Claude to re-check the current
  Streamlit component message protocol and update this file only.

  2026-07-30 UPDATE -- fixed a real browser-freeze bug
  --------------------------------------------------------------------
  On pages with a large plain HTML table (built with Streamlit's
  st.table, which creates one <tr> element per row), html2canvas had
  to walk thousands of DOM elements to build the screenshot. That work
  runs on the browser's single main thread, so on a big enough page it
  could tie the tab up for so long that Chrome showed its "Page
  Unresponsive" dialog and the whole app stopped responding to clicks
  -- the 8-second safety timer below never got a chance to fire,
  because the browser was too busy to even check the clock.

  Note: Streamlit's st.dataframe (used for the System Administration
  user list) is NOT the same as st.table -- it renders as a single
  lightweight canvas element regardless of row count, so it was never
  actually the expensive part here.

  Fix, two layers:
    1. `ignoreElements` below skips plain <table> elements and any
       element with more than 40 children when drawing -- this
       removes the actual expensive content (st.table output)
       specifically, with no visible effect on st.dataframe grids.
    2. As a backstop only (not the primary fix), we also count total
       page elements before attempting anything and skip entirely if
       it's above MAX_SAFE_ELEMENT_COUNT. Because layer 1 already
       removes the known expensive content, this threshold is set
       high -- it exists only to catch genuinely unusual pages, not
       to limit normal use of the app.

  2026-07-30 UPDATE 2 -- found the real cause of the freeze
  --------------------------------------------------------------------
  Raising the element-count threshold above didn't fully fix the
  freeze. The actual cause: this component itself lives inside an
  <iframe> that Streamlit places in the sidebar on every page (every
  custom component gets wrapped in one). Because we screenshot
  window.parent.document.body -- the WHOLE page -- that capture
  target includes this very iframe, i.e. the tool ends up trying to
  take a picture of itself while it's actively mid-capture. Browser
  rendering tools are known to hang or loop on this kind of
  self-reference, regardless of how big or small the rest of the page
  is -- which is why raising the threshold alone didn't help.

  Fix: `ignoreElements` below now explicitly skips ALL <iframe>
  elements, not just tables. There's nothing worth capturing inside
  an iframe here anyway (this component has no visible UI), and
  skipping iframes entirely also protects against any other iframe
  based content added to the app later.

  2026-07-30 UPDATE 3 -- capture the full page again, not just what's
  visible on screen
  --------------------------------------------------------------------
  UPDATE 1 limited capture to the visible viewport as part of fixing
  the freeze. That had a side effect: if the error text or content
  someone wanted to report ran below the fold, it got cut off, and the
  only workaround was zooming out first.

  Now that UPDATE 2 identified and excluded the ACTUAL freeze causes
  (this component's own iframe, and plain HTML tables) separately, we
  no longer need the viewport crop as a safety measure -- so it's
  removed. This makes captures include the full scrollable page again,
  automatically, so no one needs to zoom out to fit content in.

  2026-07-30 UPDATE 4 -- capture the right element for full height
  --------------------------------------------------------------------
  UPDATE 3 removed the crop but still targeted the outer page
  (<body>), which doesn't actually grow with content in a Streamlit
  app -- Streamlit scrolls an inner panel
  ([data-testid="stAppViewContainer"]) instead, while the outer page
  stays fixed to the window height. That meant screenshots kept only
  showing the top of the page even with no crop applied.

  Fix: capture that inner panel specifically (falling back to <body>
  if Streamlit's internal structure ever changes), and explicitly
  measure its true scrollHeight/scrollWidth ourselves rather than
  trusting html2canvas to infer it, since the panel's own on-screen
  box is only as tall as the visible window even though its content
  is taller.

  2026-07-30 UPDATE 5 -- fixed the actual remaining crop: content
  below the fold was measured correctly, but never actually PAINTED
  --------------------------------------------------------------------
  UPDATE 4 measured the panel's true scrollHeight/scrollWidth and told
  html2canvas to use those as the output canvas size. That's necessary
  but not sufficient: passing `width`/`height` to html2canvas only sets
  the size of the canvas it draws onto. It does NOT make the browser
  lay out and paint content that is currently clipped by the panel's
  own CSS (overflow: auto + a height capped to the visible window). A
  scrolled-out-of-view row in a CSS-scrolling container is still
  off-screen from the renderer's point of view no matter how big a
  canvas you ask for -- so anything below the fold kept coming out
  blank/cropped even though the *measurement* was already correct.

  Fix: immediately before capturing, we temporarily override the
  target panel's own inline style (overflow -> visible, height -> auto,
  max-height -> none) so the browser actually lays out and paints its
  entire content, and reset its scrollTop to 0 so the capture always
  starts from the top -- exactly as if the page had been scrolled from
  top to bottom. The panel's ORIGINAL inline style is saved first and
  restored immediately after the capture finishes (success, failure,
  or timeout), so this is invisible to the person using the app --
  it's on screen for well under a second, only inside this hidden
  iframe's view of the page, and the page is back to normal by the
  time they even notice the "Screenshot captured" message.

  We also no longer fire the capture immediately. Two things changed:
    1. Any <img loading="lazy"> inside the target is switched to
       eager loading and we wait for it to actually finish loading
       (bounded by a short backstop timer) -- otherwise a lazy image
       that never scrolled into view before would render as a blank
       box in the screenshot.
    2. We wait two animation frames after that before measuring/
       capturing, so the browser has had a chance to finish any
       reflow/paint work triggered by the style changes above (and by
       whatever Streamlit was doing right when the button was
       clicked) before we take the picture.
  TIMEOUT_MS was raised from 4000ms to 10000ms to comfortably fit
  these waits on a slower page/connection; the timeout is still a
  backstop, not the expected path, and it (like every other exit path)
  restores the temporary style changes before giving up.

  Everything from UPDATE 1 and UPDATE 2 (the iframe/table freeze
  fixes) is unchanged and still active below.

  Separately (see services/report_widget.py for the actual fix): a
  capture that legitimately finishes with no screenshot (page skipped
  as too large, or timed out) was being mistaken for "still in
  progress" forever, which could let a report get sent without a
  screenshot the person thought they'd already captured. That's a
  Python-side state-tracking fix, not something in this file.
-->
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body style="margin:0;">
<div id="status" style="font-family: sans-serif; font-size: 13px; color: #666; padding: 4px;">
  Capturing screenshot...
</div>
<script>
(function () {
  var SENT = false;

  // If the page has more elements than this, we skip the screenshot
  // rather than risk freezing the tab. This is a rare-case backstop,
  // not the main defense -- the ignoreElements rule below already
  // removes the actual expensive content (plain HTML tables) before
  // we get here, so this threshold is set high on purpose. It exists
  // to catch genuinely unusual pages, not to limit normal use.
  var MAX_SAFE_ELEMENT_COUNT = 6000;

  // Give up and continue without a screenshot after this long. Raised
  // from 4000 -> 10000 in UPDATE 5 to comfortably fit the render/lazy
  // image waits added below, without making a genuinely stuck capture
  // hang around too long.
  var TIMEOUT_MS = 10000;

  // Collected as we temporarily change styles to un-clip the target
  // panel, so we can always put things back exactly as they were --
  // on every exit path (success, failure, or timeout).
  var restoreFns = [];
  function restoreAll() {
    while (restoreFns.length) {
      try { restoreFns.pop()(); } catch (e) { /* best effort */ }
    }
  }

  function postToStreamlit(type, extra) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, extra || {});
    window.parent.postMessage(msg, "*");
  }

  function sendValue(value) {
    if (SENT) return; // never send twice
    SENT = true;
    restoreAll();
    postToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el) el.innerText = text;
  }

  // Tell Streamlit this component iframe is alive, and give it a
  // small fixed height (this component has no meaningful visible UI
  // -- the real UI is the Python-side status/preview in the sidebar).
  postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  postToStreamlit("streamlit:setFrameHeight", { height: 24 });

  // Safety net: if capture hasn't finished within TIMEOUT_MS for any
  // reason (slow page, blocked script, unexpected error), give up and
  // report "no screenshot" rather than leaving the report form stuck.
  window.setTimeout(function () {
    if (!SENT) {
      setStatus("Screenshot capture timed out -- continuing without it.");
      sendValue(null);
    }
  }, TIMEOUT_MS);

  // Forces any lazy-loaded images inside `target` to load right now
  // (instead of waiting for them to scroll into view, which may never
  // happen before we capture), then waits for either all of them to
  // finish or a short backstop timer, then gives the browser two
  // animation frames to finish painting before calling `callback`.
  function waitForRenderReady(target, callback) {
    var imgs = target.querySelectorAll('img[loading="lazy"]');
    var pending = 0;
    var settled = false;

    function proceed() {
      if (settled) return;
      settled = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(callback);
      });
    }

    imgs.forEach(function (img) {
      img.loading = "eager";
      if (!img.complete) {
        pending++;
        var done = function () {
          pending -= 1;
          if (pending <= 0) proceed();
        };
        img.addEventListener("load", done, { once: true });
        img.addEventListener("error", done, { once: true });
      }
    });

    // Backstop: never wait more than 1.5s on images, even if some
    // never finish loading.
    window.setTimeout(proceed, 1500);

    if (pending === 0) proceed();
  }

  try {
    var parentDoc = (window.parent && window.parent.document) ? window.parent.document : document;

    // Streamlit doesn't scroll the whole browser page -- the outer
    // <body> stays fixed to the window height, and an inner panel
    // (identified by this data-testid) scrolls independently. If we
    // hand html2canvas the outer body, it measures a height equal to
    // the visible window, not the true page content, and everything
    // below the fold gets left out even with no crop applied. So we
    // capture that inner panel specifically, and fall back to body
    // only if Streamlit's internal structure ever changes and this
    // selector stops matching.
    var target = parentDoc.querySelector('[data-testid="stAppViewContainer"]')
      || parentDoc.body
      || document.body;

    // Cheap, near-instant safety check -- does NOT redraw anything,
    // just counts existing elements. This is what actually prevents
    // the freeze on heavy pages like System Administration.
    var elementCount = target.querySelectorAll("*").length;
    if (elementCount > MAX_SAFE_ELEMENT_COUNT) {
      setStatus("This page is too large to screenshot automatically -- continuing without it.");
      sendValue(null);
      return;
    }

    // UPDATE 5 fix: measuring scrollHeight/scrollWidth (below) tells
    // us how TALL the content is, but the browser only actually PAINTS
    // content that isn't clipped by the panel's own overflow/height.
    // Temporarily remove that clipping so everything gets laid out and
    // painted, and remember the original inline style so we can put it
    // back the instant we're done.
    var originalStyleAttr = target.getAttribute("style");
    restoreFns.push(function () {
      if (originalStyleAttr === null) target.removeAttribute("style");
      else target.setAttribute("style", originalStyleAttr);
    });
    target.style.setProperty("overflow", "visible", "important");
    target.style.setProperty("height", "auto", "important");
    target.style.setProperty("max-height", "none", "important");

    // Always capture starting from the top of the page, exactly as if
    // it had been scrolled top to bottom -- not from wherever the
    // person happened to have scrolled to when they clicked "Capture".
    var originalScrollTop = target.scrollTop;
    target.scrollTop = 0;
    restoreFns.push(function () { target.scrollTop = originalScrollTop; });

    waitForRenderReady(target, function () {
      try {
        // Explicitly measure the full content size ourselves rather
        // than trusting html2canvas's own measurement -- now that
        // overflow/height clipping is removed above, scrollHeight/
        // scrollWidth reliably reflect the true, fully-laid-out
        // content size.
        var fullHeight = Math.max(target.scrollHeight, target.offsetHeight, target.clientHeight);
        var fullWidth = Math.max(target.scrollWidth, target.offsetWidth, target.clientWidth);

        html2canvas(target, {
          logging: false,
          useCORS: true,
          scale: 1,
          x: 0,
          y: 0,
          scrollX: 0,
          scrollY: 0,
          width: fullWidth,
          height: fullHeight,
          windowWidth: fullWidth,
          windowHeight: fullHeight,
          // Skip large repeating structures (tables, data grids) --
          // these are the most expensive part to redraw and rarely
          // the reason someone is reporting a problem.
          ignoreElements: function (el) {
            try {
              // Skip ALL iframes -- this is the main freeze fix from
              // UPDATE 2. Without this, html2canvas ends up trying to
              // capture this very component (which lives in an
              // iframe) while it's mid-capture, which is a known way
              // to make it hang or loop indefinitely.
              if (el.tagName === "IFRAME") return true;
              if (el.tagName === "TABLE") return true;
              if (el.getAttribute && el.getAttribute("role") === "table") return true;
              if (el.querySelectorAll && el.children && el.children.length > 40) return true;
            } catch (e) {
              return false;
            }
            return false;
          },
        }).then(function (canvas) {
          try {
            // JPEG at moderate quality keeps the payload well under
            // any reasonable database column / email attachment size
            // limit.
            var dataUrl = canvas.toDataURL("image/jpeg", 0.6);
            setStatus("Screenshot captured.");
            sendValue(dataUrl);
          } catch (e) {
            setStatus("Could not encode screenshot -- continuing without it.");
            sendValue(null);
          }
        }).catch(function () {
          setStatus("Could not capture screenshot -- continuing without it.");
          sendValue(null);
        });
      } catch (e) {
        setStatus("Screenshot capture unavailable -- continuing without it.");
        sendValue(null);
      }
    });
  } catch (e) {
    setStatus("Screenshot capture unavailable -- continuing without it.");
    sendValue(null);
  }
})();
</script>
</body>
</html>
